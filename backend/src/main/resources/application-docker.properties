# Perfil 'docker': PostgreSQL (servicio 'db' del docker-compose)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/finance}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:finance}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:finance}
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false
